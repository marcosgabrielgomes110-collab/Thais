[workspace]
resolver = "3"
members = [
    "crates/thais-protocol",
    "crates/thais-sdk",
    "crates/thais-providers",
    "crates/thais-storage",
    "crates/thais-tools",
    "crates/thais-core",
    "crates/thais-tui",
    "crates/thais-cli",
    "test/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6.0"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
ignore = "0.4"
insta = { version = "1", features = ["json"] }
keyring = "4.2"
predicates = "3"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
rusqlite = { version = "0.40", features = ["bundled-full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.39"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "8.0"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
