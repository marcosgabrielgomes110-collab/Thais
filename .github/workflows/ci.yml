name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run make ci
        run: make ci

      - name: Check the architecture boundary
        run: make boundary

      - name: Check install and uninstall
        shell: bash
        run: |
          prefix="$(mktemp -d)"
          make install PREFIX="$prefix"
          test -x "$prefix/bin/thais"
          make uninstall PREFIX="$prefix"
          test ! -e "$prefix/bin/thais"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2026-0370,RUSTSEC-2026-0371,RUSTSEC-2026-0372

  container-smoke:
    name: Clean install container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run clean container
        run: ./scripts/clean-install.sh

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
