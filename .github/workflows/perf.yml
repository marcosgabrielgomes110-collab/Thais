name: Performance

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Linux performance smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/perf.sh
