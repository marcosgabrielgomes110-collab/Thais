name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Check
        run: make check

      - name: Build, SBOM, checksums, and signature
        env:
          THAIS_SIGNING_KEY: ${{ secrets.THAIS_SIGNING_KEY }}
        run: ./scripts/release.sh "$GITHUB_REF_NAME"

      - name: Install cargo-dist
        run: cargo install cargo-dist --locked --version 0.30.0

      - name: Build cargo-dist archives, installers, and checksums
        run: |
          dist build --artifacts=all --target x86_64-unknown-linux-gnu \
            --tag "$GITHUB_REF_NAME" --force-tag --allow-dirty
          cd target/distrib
          sha256sum \
            thais-cli-x86_64-unknown-linux-gnu.tar.xz \
            thais-sandbox-x86_64-unknown-linux-gnu.tar.xz \
            thais-cli-installer.sh \
            thais-sandbox-installer.sh \
            source.tar.gz > SHA256SUMS.dist

      - name: Sign cargo-dist checksums
        run: |
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"
          gpg --batch --yes --local-user "$fingerprint" --armor --detach-sign \
            --output target/distrib/SHA256SUMS.dist.asc \
            target/distrib/SHA256SUMS.dist
          gpg --armor --export "$fingerprint" > target/release/thais-signing-key.asc

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thais-${{ github.ref_name }}
          path: |
            target/release/thais
            target/release/thais-sandbox
            target/release/thais-sbom.cdx.json
            target/release/SHA256SUMS
            target/release/SHA256SUMS.asc
            target/release/thais-sbom.cdx.json.asc
            target/release/thais-signing-key.asc
            target/distrib/thais-cli-x86_64-unknown-linux-gnu.tar.xz
            target/distrib/thais-sandbox-x86_64-unknown-linux-gnu.tar.xz
            target/distrib/thais-cli-installer.sh
            target/distrib/thais-sandbox-installer.sh
            target/distrib/source.tar.gz
            target/distrib/SHA256SUMS.dist
            target/distrib/SHA256SUMS.dist.asc

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          latest="--latest"
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease"; latest="--latest=false" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            target/release/thais \
            target/release/thais-sandbox \
            target/release/thais-sbom.cdx.json \
            target/release/SHA256SUMS \
            target/release/SHA256SUMS.asc \
            target/release/thais-sbom.cdx.json.asc \
            target/release/thais-signing-key.asc \
            target/distrib/thais-cli-x86_64-unknown-linux-gnu.tar.xz \
            target/distrib/thais-sandbox-x86_64-unknown-linux-gnu.tar.xz \
            target/distrib/thais-cli-installer.sh \
            target/distrib/thais-sandbox-installer.sh \
            target/distrib/source.tar.gz \
            target/distrib/SHA256SUMS.dist \
            target/distrib/SHA256SUMS.dist.asc \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            $latest \
            $prerelease
